pluginManagement {
    repositories {
        gradlePluginPortal {
            content { excludeGroup('org.apache.logging.log4j') }
        }
        mavenCentral()
        maven {
            url = 'https://maven.minecraftforge.net/'
            content {
                includeGroup('net.minecraftforge')
                includeGroup('de.oceanlabs.mcp')
            }
        }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.wagyourtail.xyz/releases' }
        maven { url = 'https://maven.arcseekers.com/releases' }
        maven { url = 'https://maven.wagyourtail.xyz/snapshots' }
    }
}

rootProject.name = 'ponder-ae2s-preview'
