name: Build

on:
  push:
    branches:
      - main
      - master
      - 'cleanroom/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Test and build Cleanroom client and server shim
        run: ./gradlew.bat test remapJar sourcesJar forgeServerShimJar --stacktrace

      - name: Upload Cleanroom artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cleanroom-artifacts
          path: build/libs/*.jar
          if-no-files-found: error
