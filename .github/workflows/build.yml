name: Build

on:
  push:
    branches:
      - main
      - master
      - 'cleanroom/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Test and build Cleanroom client and server shim
        run: ./gradlew.bat test remapJar sourcesJar forgeServerShimJar --stacktrace

      - name: Verify repository routing during Forge outages
        run: python scripts/test-repository-routing.py --work-dir "${{ runner.temp }}/ponder-repository-routing"

      - name: Upload Cleanroom artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cleanroom-artifacts
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload build and repository diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build/reports/tests/
            build/test-results/
            ${{ runner.temp }}/ponder-repository-routing/**/gradle.log
            ${{ runner.temp }}/ponder-repository-routing/**/requests.json
          if-no-files-found: warn
